spring:
  application:
    name: example-plans
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/example_billing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:migrations
    schemas: plans
    default-schema: plans

server:
  port: ${SERVER_PORT:8080}

scalar:
  url: /docs
