spring:
  application:
    name: example-plans
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/example_billing}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:migrations
    schemas: plans
    default-schema: plans

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  path: /docs
  page-title: example-plans API
