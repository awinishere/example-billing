spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: wonderwrite-authentication
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:migrations
    schemas: private_identity
    default-schema: private_identity

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

app:
  mail:
    from: ${MAIL_FROM:noreply@wonderwrite.local}

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  path: /docs
  page-title: Wonderwrite Authentication API
