<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${productName}">Product</title>
</head>
<body>

<p>Hello <span th:text="${recipientName}">there</span>,</p>

<p>Your <span th:text="${productName}">Product</span> verification code is:</p>

<p th:text="${code}">000000</p>

<p>
    This code expires in <span th:text="${ttlMinutes}">5</span> minutes
    and can be used only once.
</p>

<p>Please don't share this code with anyone.</p>

<p>
    Thanks,<br>
    The <span th:text="${productName}">Product</span> Team
</p>

</body>
</html>
